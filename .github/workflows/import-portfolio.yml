name: Import portfolio source
on:
  push:
    paths:
      - '.source-bundle/part-05'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and import source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .source-bundle/part-* | base64 --decode > portfolio.tar.xz
          tar -xJf portfolio.tar.xz
          cp -a steven-portfolio-v1/. .
          rm -rf steven-portfolio-v1 .source-bundle portfolio.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import full portfolio project from uploaded archive"
            git push origin HEAD:main
          fi
